<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>RaceTracksAPI - Circuit Maps & Data</title>
		<style>
			@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap");

			:root {
				--bg-color: #121212;
				--card-bg: #1e1e1e;
				--text-main: #f5f5f5;
				--text-muted: #a0a0a0;
				--accent-red: #e10600;
			}

			body {
				font-family: "Inter", sans-serif;
				background-color: var(--bg-color);
				color: var(--text-main);
				margin: 0;
				padding: 0;
				line-height: 1.6;
			}

			header {
				text-align: center;
				padding: 4rem 2rem;
				background: linear-gradient(180deg, #1a1a1a 0%, var(--bg-color) 100%);
				border-bottom: 1px solid #333;
			}

			header h1 {
				font-size: 3rem;
				margin: 0;
				font-weight: 800;
				letter-spacing: -1px;
			}

			header p {
				color: var(--text-muted);
				max-width: 600px;
				margin: 1rem auto;
				font-size: 1.1rem;
			}

			.github-link {
				display: inline-block;
				margin-top: 1.5rem;
				padding: 0.8rem 1.5rem;
				background-color: #fff;
				color: #000;
				text-decoration: none;
				font-weight: 600;
				border-radius: 4px;
				transition: background 0.2s;
			}

			.github-link:hover {
				background-color: #ddd;
			}

			main {
				max-width: 1200px;
				margin: 3rem auto;
				padding: 0 2rem;
			}

			.filter-card {
				border-radius: 12px;
				padding: 1.5rem;
				margin-bottom: 2rem;
				display: flex;
				flex-wrap: wrap;
				gap: 1.5rem;
				align-items: flex-end;
			}

			.filter-group {
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
			}

			.filter-group label {
				font-size: 0.8rem;
				font-weight: 600;
				color: var(--text-muted);
				text-transform: uppercase;
				letter-spacing: 0.5px;
			}

			.filter-input {
				padding: 0.6rem 1rem;
				border-radius: 6px;
				background-color: var(--bg-color);
				color: var(--text-main);
				border: 1px solid #333;
				font-family: inherit;
				font-size: 0.95rem;
				transition: border-color 0.2s;
				height: 42px;
				box-sizing: border-box;
			}

			.filter-input:focus {
				outline: none;
				border-color: #555;
			}

			.search-group {
				flex-grow: 1;
				min-width: 250px;
			}

			.min-max-wrapper {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				background-color: var(--bg-color);
				border: 1px solid #333;
				border-radius: 6px;
				padding: 0 0.5rem;
				height: 42px;
				box-sizing: border-box;
			}

			.min-max-wrapper input {
				background: transparent;
				border: none;
				color: var(--text-main);
				width: 60px;
				padding: 0.5rem;
				text-align: center;
				font-family: inherit;
				font-size: 0.95rem;
			}

			.min-max-wrapper input:focus {
				outline: none;
			}

			.min-max-wrapper input::-webkit-outer-spin-button,
			.min-max-wrapper input::-webkit-inner-spin-button {
				-webkit-appearance: none;
				margin: 0;
			}

			.counter-wrapper {
				margin-left: auto;
				display: flex;
				align-items: center;
				height: 42px;
			}

			.track-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
				gap: 2rem;
			}

			.card {
				background-color: var(--card-bg);
				border: 1px solid #333;
				border-radius: 12px;
				overflow: hidden;
				transition:
					transform 0.2s,
					border-color 0.2s;
				display: flex;
				flex-direction: column;
			}

			.card:hover {
				transform: translateY(-5px);
				border-color: #555;
			}

			.card-image {
				width: 100%;
				height: 200px;
				background-color: #111;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1rem;
				box-sizing: border-box;
				border-bottom: 1px solid #333;
			}

			.card-image img {
				max-width: 100%;
				max-height: 100%;
				filter: invert(1) opacity(0.8);
				transition: filter 0.2s;
			}

			.card:hover .card-image img {
				filter: invert(1) opacity(1);
			}

			.card-content {
				padding: 1.5rem;
				flex-grow: 1;
			}

			.badge {
				display: inline-block;
				padding: 0.2rem 0.6rem;
				font-size: 0.75rem;
				font-weight: 600;
				text-transform: uppercase;
				border-radius: 4px;
				margin-bottom: 1rem;
			}

			.badge.real {
				background-color: rgba(225, 6, 0, 0.1);
				color: var(--accent-red);
				border: 1px solid rgba(225, 6, 0, 0.3);
			}

			.badge.fictional {
				background-color: rgba(0, 85, 255, 0.1);
				color: #6699ff;
				border: 1px solid rgba(0, 85, 255, 0.3);
			}

			.card h2 {
				margin: 0 0 0.5rem 0;
				font-size: 1.25rem;
			}

			.card h3 {
				margin: 0 0 1rem 0;
				font-size: 1rem;
				color: var(--text-muted);
				font-weight: 400;
			}

			.card-footer {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-top: auto;
				padding-top: 1rem;
				border-top: 1px solid #333;
				font-size: 0.85rem;
				color: var(--text-muted);
			}
		</style>
	</head>
	<body>
		<header>
			<h1>RaceTracksAPI</h1>
			<p>
				A free, open-source JSON API providing structured data and high-quality
				SVG maps for real-world and fictional racing circuits.
			</p>
			<a
				href="https://github.com/LigasAVBrasil/RaceTracksAPI"
				class="github-link"
				>View on GitHub</a
			>
		</header>

		<main>
			<div class="filter-card">
				<div class="filter-group search-group">
					<label for="search-input">Search</label>
					<input
						type="text"
						id="search-input"
						class="filter-input"
						placeholder="Track or layout (e.g., Oval)"
					/>
				</div>

				<div class="filter-group">
					<label>Length (km)</label>
					<div class="min-max-wrapper">
						<input
							type="number"
							id="min-length"
							placeholder="Min"
							min="0"
							step="0.1"
						/>
						<span style="color: var(--text-muted)">-</span>
						<input
							type="number"
							id="max-length"
							placeholder="Max"
							min="0"
							step="0.1"
						/>
					</div>
				</div>

				<div class="filter-group">
					<label for="region-filter">Region</label>
					<select
						id="region-filter"
						class="filter-input"
						style="cursor: pointer"
					>
						<option value="All">All Regions</option>
						<option value="Africa">Africa</option>
						<option value="Asia">Asia</option>
						<option value="Europe">Europe</option>
						<option value="Middle East">Middle East</option>
						<option value="North America">North America</option>
						<option value="Oceania">Oceania</option>
						<option value="South America">South America</option>
					</select>
				</div>

				<div class="filter-group">
					<label for="category-filter">Category</label>
					<select
						id="category-filter"
						class="filter-input"
						style="cursor: pointer"
					>
						<option value="All">All Categories</option>
					</select>
				</div>

				<div class="counter-wrapper">
					<span
						id="track-counter"
						style="
							color: var(--accent-red);
							font-size: 0.9rem;
							font-weight: 600;
							background-color: rgba(225, 6, 0, 0.1);
							padding: 0.4rem 1rem;
							border-radius: 20px;
							white-space: nowrap;
							border: 1px solid rgba(225, 6, 0, 0.3);
						"
					>
						Loading...
					</span>
				</div>
			</div>
			<div class="track-grid" id="track-grid"></div>
		</main>

		<script>
			let allTracksData = [];

			function renderTracks(tracksToRender) {
				const grid = document.getElementById("track-grid");
				grid.innerHTML = "";
				let layoutCount = 0;

				tracksToRender.forEach((track) => {
					if (!track.layouts || track.layouts.length === 0) return;

					track.layouts.forEach((layout) => {
						layoutCount++;
						const card = document.createElement("div");
						card.className = "card";

						const isFictional = track.isFictional === true;
						const badgeClass = isFictional ? "badge fictional" : "badge real";
						const badgeText = isFictional
							? `Fictional (${track.fictionalSource})`
							: "Real World Circuit";

						let yearString = "";
						if (layout.start_year) {
							const endYear = layout.end_year ? layout.end_year : "Present";
							yearString = ` (${layout.start_year} - ${endYear})`;
						}
						const lengthMiles = (parseFloat(layout.length) * 0.621371).toFixed(
							3,
						);

						let mapsLinkHtml = "";
						if (track.latitude && track.longitude) {
							const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${track.latitude},${track.longitude}`;
							mapsLinkHtml = `
								<a href="${mapsUrl}" target="_blank" style="color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 4px; transition: color 0.2s;" onmouseover="this.style.color='var(--text-main)'" onmouseout="this.style.color='var(--text-muted)'" title="View on Google Maps">
									📍 Maps
								</a>
							`;
						}

						card.innerHTML = `
							<div class="card-image">
								<img src="./images/track_${layout.image_id}.svg" alt="Map of ${track.name} - ${layout.name}" onerror="this.style.display='none'">
							</div>
							<div class="card-content">
								<span class="${badgeClass}">${badgeText}</span>
								<h2>${track.name}</h2>
								<h3><strong>Layout:</strong> ${layout.name}${yearString}</h3>
								
								<p style="margin: 0 0 1rem 0; font-size: 0.95rem; color: var(--text-muted);">
									<strong>Length:</strong> ${layout.length}km / ${lengthMiles} miles
								</p>

								<div class="card-footer">
									<div style="display: flex; align-items: center; gap: 15px;">
										<span style="display: flex; align-items: center; gap: 5px;">
											<img src="https://flagsapi.com/${track.country}/flat/64.png" style="width: 24px; height: auto;" alt="${track.country} flag">
											${track.country}
										</span>
										${mapsLinkHtml}
									</div>
									
									<span>ID: ${layout.image_id}</span>
								</div>
							</div>
						`;
						grid.appendChild(card);
					});
				});

				const counterElement = document.getElementById("track-counter");
				if (counterElement) {
					counterElement.textContent = `${layoutCount} Layout(s)`;
				}
				if (layoutCount === 0) {
					grid.innerHTML = `<p style="color: var(--text-muted); text-align: center; width: 100%; grid-column: 1 / -1;">No tracks found matching your filters.</p>`;
				}
			}

			function populateCategories(tracks) {
				const categoryFilter = document.getElementById("category-filter");

				categoryFilter.innerHTML =
					'<option value="All">All Categories</option>';

				const categoryTree = {};

				function mergeIntoTree(treeNode, category) {
					if (!treeNode[category.name]) {
						treeNode[category.name] = { subcategories: {} };
					}
					if (category.subcategories && category.subcategories.length > 0) {
						category.subcategories.forEach((sub) => {
							mergeIntoTree(treeNode[category.name].subcategories, sub);
						});
					}
				}

				tracks.forEach((track) => {
					if (track.categories) {
						track.categories.forEach((cat) => mergeIntoTree(categoryTree, cat));
					}
				});

				function renderTreeOptions(treeNode, level = 0) {
					const sortedKeys = Object.keys(treeNode).sort();

					sortedKeys.forEach((categoryName) => {
						const option = document.createElement("option");
						option.value = categoryName;

						const indent = "\u00A0\u00A0\u00A0\u00A0".repeat(level);
						const prefix = level > 0 ? indent + "↳ " : "";

						option.textContent = prefix + categoryName;

						if (level === 0) {
							option.style.fontWeight = "bold";
						}

						categoryFilter.appendChild(option);

						renderTreeOptions(treeNode[categoryName].subcategories, level + 1);
					});
				}
				renderTreeOptions(categoryTree);
			}

			function hasCategory(category, targetName) {
				if (category.name === targetName) return true;
				if (category.subcategories && category.subcategories.length > 0) {
					return category.subcategories.some((sub) =>
						hasCategory(sub, targetName),
					);
				}
				return false;
			}

			function applyFilters() {
				const regionValue = document.getElementById("region-filter").value;
				const categoryValue = document.getElementById("category-filter").value;
				const searchValue = document
					.getElementById("search-input")
					.value.toLowerCase()
					.trim();

				const minLength =
					parseFloat(document.getElementById("min-length").value) || 0;
				const maxLength =
					parseFloat(document.getElementById("max-length").value) || Infinity;

				const filteredTracks = allTracksData
					.map((track) => {
						const matchesRegion =
							regionValue === "All" || track.region === regionValue;

						let matchesCategory = categoryValue === "All";
						if (!matchesCategory && track.categories) {
							matchesCategory = track.categories.some((category) =>
								hasCategory(category, categoryValue),
							);
						}

						if (!matchesRegion || !matchesCategory) {
							return { ...track, layouts: [] };
						}

						const trackName = track.name.toLowerCase();
						let trackSearchMatch = trackName.includes(searchValue);
						if (!trackSearchMatch && track.similarNames) {
							trackSearchMatch = track.similarNames.some((alias) =>
								alias.toLowerCase().includes(searchValue),
							);
						}

						const filteredLayouts = track.layouts.filter((layout) => {
							const layoutNameMatch = layout.name
								.toLowerCase()
								.includes(searchValue);

							const matchesSearch = trackSearchMatch || layoutNameMatch;

							const length = parseFloat(layout.length);
							const matchesLength = length >= minLength && length <= maxLength;

							return matchesSearch && matchesLength;
						});

						return { ...track, layouts: filteredLayouts };
					})
					.filter((track) => track.layouts.length > 0);

				renderTracks(filteredTracks);
			}

			async function loadTracks() {
				const grid = document.getElementById("track-grid");
				try {
					const response = await fetch("./tracks.json");
					allTracksData = await response.json();
					populateCategories(allTracksData);
					renderTracks(allTracksData);
				} catch (error) {
					console.error("Error loading tracks:", error);
					grid.innerHTML = `<p style="color: var(--accent-red); text-align: center; width: 100%;">Failed to load track data. Make sure tracks.json exists.</p>`;
					const counterElement = document.getElementById("track-counter");
					if (counterElement) counterElement.textContent = "Erro ao carregar";
				}
			}

			document
				.getElementById("region-filter")
				.addEventListener("change", applyFilters);
			document
				.getElementById("category-filter")
				.addEventListener("change", applyFilters);
			document
				.getElementById("search-input")
				.addEventListener("input", applyFilters);
			document
				.getElementById("min-length")
				.addEventListener("input", applyFilters);
			document
				.getElementById("max-length")
				.addEventListener("input", applyFilters);

			document.addEventListener("DOMContentLoaded", loadTracks);
		</script>
	</body>
</html>
