<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>RaceTracksAPI - Circuit Maps & Data</title>
		<style>
			@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap");

			:root {
				--bg-color: #121212;
				--card-bg: #1e1e1e;
				--text-main: #f5f5f5;
				--text-muted: #a0a0a0;
				--accent-red: #e10600;
			}

			body {
				font-family: "Inter", sans-serif;
				background-color: var(--bg-color);
				color: var(--text-main);
				margin: 0;
				padding: 0;
				line-height: 1.6;
			}

			header {
				text-align: center;
				padding: 4rem 2rem;
				background: linear-gradient(180deg, #1a1a1a 0%, var(--bg-color) 100%);
				border-bottom: 1px solid #333;
			}

			header h1 {
				font-size: 3rem;
				margin: 0;
				font-weight: 800;
				letter-spacing: -1px;
			}

			header p {
				color: var(--text-muted);
				max-width: 600px;
				margin: 1rem auto;
				font-size: 1.1rem;
			}

			.github-link {
				display: inline-block;
				margin-top: 1.5rem;
				padding: 0.8rem 1.5rem;
				background-color: #fff;
				color: #000;
				text-decoration: none;
				font-weight: 600;
				border-radius: 4px;
				transition: background 0.2s;
			}

			.github-link:hover {
				background-color: #ddd;
			}

			main {
				max-width: 1200px;
				margin: 3rem auto;
				padding: 0 2rem;
			}

			.track-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
				gap: 2rem;
			}

			.card {
				background-color: var(--card-bg);
				border: 1px solid #333;
				border-radius: 12px;
				overflow: hidden;
				transition:
					transform 0.2s,
					border-color 0.2s;
				display: flex;
				flex-direction: column;
			}

			.card:hover {
				transform: translateY(-5px);
				border-color: #555;
			}

			.card-image {
				width: 100%;
				height: 200px;
				background-color: #111;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1rem;
				box-sizing: border-box;
				border-bottom: 1px solid #333;
			}

			.card-image img {
				max-width: 100%;
				max-height: 100%;
				filter: invert(1) opacity(0.8);
				transition: filter 0.2s;
			}

			.card:hover .card-image img {
				filter: invert(1) opacity(1);
			}

			.card-content {
				padding: 1.5rem;
				flex-grow: 1;
			}

			.badge {
				display: inline-block;
				padding: 0.2rem 0.6rem;
				font-size: 0.75rem;
				font-weight: 600;
				text-transform: uppercase;
				border-radius: 4px;
				margin-bottom: 1rem;
			}

			.badge.real {
				background-color: rgba(225, 6, 0, 0.1);
				color: var(--accent-red);
				border: 1px solid rgba(225, 6, 0, 0.3);
			}

			.badge.fictional {
				background-color: rgba(0, 85, 255, 0.1);
				color: #6699ff;
				border: 1px solid rgba(0, 85, 255, 0.3);
			}

			.card h2 {
				margin: 0 0 0.5rem 0;
				font-size: 1.25rem;
			}

			.card h3 {
				margin: 0 0 1rem 0;
				font-size: 1rem;
				color: var(--text-muted);
				font-weight: 400;
			}

			.card-footer {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-top: auto;
				padding-top: 1rem;
				border-top: 1px solid #333;
				font-size: 0.85rem;
				color: var(--text-muted);
			}
		</style>
	</head>
	<body>
		<header>
			<h1>RaceTracksAPI</h1>
			<p>
				A free, open-source JSON API providing structured data and high-quality
				SVG maps for real-world and fictional racing circuits.
			</p>
			<a
				href="https://github.com/LigasAVBrasil/RaceTracksAPI"
				class="github-link"
				>View on GitHub</a
			>
		</header>

		<main>
			<div
				class="filter-section"
				style="
					margin-bottom: 2rem;
					display: flex;
					align-items: center;
					gap: 1rem;
					flex-wrap: wrap;
				"
			>
				<input
					type="text"
					id="search-input"
					placeholder="Search track or alias (e.g., Interlagos)"
					style="
						padding: 0.5rem 1rem;
						border-radius: 6px;
						background-color: var(--card-bg);
						color: var(--text-main);
						border: 1px solid #333;
						font-family: inherit;
						font-size: 1rem;
						flex-grow: 1;
						min-width: 250px;
					"
				/>

				<label
					for="region-filter"
					style="font-weight: 600; color: var(--text-muted)"
					>Filter by Region:</label
				>
				<select
					id="region-filter"
					style="
						padding: 0.5rem 1rem;
						border-radius: 6px;
						background-color: var(--card-bg);
						color: var(--text-main);
						border: 1px solid #333;
						font-family: inherit;
						font-size: 1rem;
						cursor: pointer;
					"
				>
					<option value="All">All Regions</option>
					<option value="Africa">Africa</option>
					<option value="Asia">Asia</option>
					<option value="Europe">Europe</option>
					<option value="Middle East">Middle East</option>
					<option value="North America">North America</option>
					<option value="Oceania">Oceania</option>
					<option value="South America">South America</option>
				</select>

				<label
					for="category-filter"
					style="font-weight: 600; color: var(--text-muted)"
					>Filter by Category:</label
				>
				<select
					id="category-filter"
					style="
						padding: 0.5rem 1rem;
						border-radius: 6px;
						background-color: var(--card-bg);
						color: var(--text-main);
						border: 1px solid #333;
						font-family: inherit;
						font-size: 1rem;
						cursor: pointer;
					"
				>
					<option value="All">All Categories</option>
				</select>

				<span
					id="track-counter"
					style="
						color: var(--accent-red);
						font-size: 0.9rem;
						font-weight: 600;
						background-color: rgba(225, 6, 0, 0.1);
						padding: 0.3rem 0.8rem;
						border-radius: 20px;
					"
				>
					Loading...
				</span>
			</div>
			<div class="track-grid" id="track-grid"></div>
		</main>

		<script>
			let allTracksData = [];

			function renderTracks(tracksToRender) {
				const grid = document.getElementById("track-grid");
				grid.innerHTML = "";
				let layoutCount = 0;

				tracksToRender.forEach((track) => {
					if (!track.layouts || track.layouts.length === 0) return;

					track.layouts.forEach((layout) => {
						layoutCount++;
						const card = document.createElement("div");
						card.className = "card";

						const isFictional = track.isFictional === true;
						const badgeClass = isFictional ? "badge fictional" : "badge real";
						const badgeText = isFictional
							? `Fictional (${track.fictionalSource})`
							: "Real World Circuit";

						let yearString = "";
						if (layout.start_year) {
							const endYear = layout.end_year ? layout.end_year : "Present";
							yearString = ` (${layout.start_year} - ${endYear})`;
						}
						const lengthMiles = (parseFloat(layout.length) * 0.621371).toFixed(
							3,
						);

						let mapsLinkHtml = "";
						if (track.latitude && track.longitude) {
							const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${track.latitude},${track.longitude}`;
							mapsLinkHtml = `
								<a href="${mapsUrl}" target="_blank" style="color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 4px; transition: color 0.2s;" onmouseover="this.style.color='var(--text-main)'" onmouseout="this.style.color='var(--text-muted)'" title="View on Google Maps">
									📍 Maps
								</a>
							`;
						}

						card.innerHTML = `
							<div class="card-image">
								<img src="./images/track_${layout.image_id}.svg" alt="Map of ${track.name} - ${layout.name}" onerror="this.style.display='none'">
							</div>
							<div class="card-content">
								<span class="${badgeClass}">${badgeText}</span>
								<h2>${track.name}</h2>
								<h3><strong>Layout:</strong> ${layout.name}${yearString}</h3>
								
								<p style="margin: 0 0 1rem 0; font-size: 0.95rem; color: var(--text-muted);">
									<strong>Length:</strong> ${layout.length}km / ${lengthMiles} miles
								</p>

								<div class="card-footer">
									<div style="display: flex; align-items: center; gap: 15px;">
										<span style="display: flex; align-items: center; gap: 5px;">
											<img src="https://flagsapi.com/${track.country}/flat/64.png" style="width: 24px; height: auto;" alt="${track.country} flag">
											${track.country}
										</span>
										${mapsLinkHtml}
									</div>
									
									<span>ID: ${layout.image_id}</span>
								</div>
							</div>
						`;
						grid.appendChild(card);
					});
				});

				const counterElement = document.getElementById("track-counter");
				if (counterElement) {
					counterElement.textContent = `${layoutCount} Layout(s)`;
				}
				if (layoutCount === 0) {
					grid.innerHTML = `<p style="color: var(--text-muted); text-align: center; width: 100%; grid-column: 1 / -1;">No tracks found matching your filters.</p>`;
				}
			}

			function populateCategories(tracks) {
				const categoryFilter = document.getElementById("category-filter");
				const uniqueCategories = new Set();

				tracks.forEach((track) => {
					if (track.categories) {
						track.categories.forEach((category) => {
							if (category.subcategories) {
								category.subcategories.forEach((sub) => {
									uniqueCategories.add(sub.name);
								});
							}
						});
					}
				});

				const sortedCategories = Array.from(uniqueCategories).sort();
				sortedCategories.forEach((cat) => {
					const option = document.createElement("option");
					option.value = cat;
					option.textContent = cat;
					categoryFilter.appendChild(option);
				});
			}

			function applyFilters() {
				const regionValue = document.getElementById("region-filter").value;
				const categoryValue = document.getElementById("category-filter").value;
				const searchValue = document
					.getElementById("search-input")
					.value.toLowerCase()
					.trim();

				const filteredTracks = allTracksData.filter((track) => {
					const matchesRegion =
						regionValue === "All" || track.region === regionValue;
					const trackName = track.name.toLowerCase();
					let matchesSearch = trackName.includes(searchValue);

					if (!matchesSearch && track.similarNames) {
						matchesSearch = track.similarNames.some((alias) =>
							alias.toLowerCase().includes(searchValue),
						);
					}

					let matchesCategory = categoryValue === "All";
					if (!matchesCategory && track.categories) {
						matchesCategory = track.categories.some((category) => {
							if (category.subcategories) {
								return category.subcategories.some(
									(sub) => sub.name === categoryValue,
								);
							}
							return false;
						});
					}

					return matchesRegion && matchesSearch && matchesCategory;
				});

				renderTracks(filteredTracks);
			}

			async function loadTracks() {
				const grid = document.getElementById("track-grid");
				try {
					const response = await fetch("./tracks.json");
					allTracksData = await response.json();
					populateCategories(allTracksData);
					renderTracks(allTracksData);
				} catch (error) {
					console.error("Error loading tracks:", error);
					grid.innerHTML = `<p style="color: var(--accent-red); text-align: center; width: 100%;">Failed to load track data. Make sure tracks.json exists.</p>`;
					const counterElement = document.getElementById("track-counter");
					if (counterElement) counterElement.textContent = "Erro ao carregar";
				}
			}

			document
				.getElementById("region-filter")
				.addEventListener("change", applyFilters);
			document
				.getElementById("category-filter")
				.addEventListener("change", applyFilters);
			document
				.getElementById("search-input")
				.addEventListener("input", applyFilters);

			document.addEventListener("DOMContentLoaded", loadTracks);
		</script>
	</body>
</html>
